name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.app_env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app_env: [development, staging, production]
    env:
      APP_ENV: ${{ matrix.app_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash scripts/verify-env.sh "$APP_ENV"
